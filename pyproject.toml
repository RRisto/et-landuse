[project]
name = "estonia-landuse-neuroevolution"
version = "0.1.0"
description = "Neuroevolution demo for Estonian county-level land-use planning"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
]

[project.optional-dependencies]
pipeline = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "owslib>=0.31.0",
    "rasterio>=1.3.0",
    "pyyaml>=6.0.0",
    "unfccc-di-api>=4.0.4",
    "scikit-learn>=1.7.2",
    "aiohttp>=3.14.1",
    "nest-asyncio>=1.6.0",
]
notebook = [
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "folium>=0.15.0",
    "mapclassify>=2.6.0",
    "playwright>=1.61.0",
    "jupytext>=1.19.4",
]
ml = [
    "torch>=2.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.9.0",
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "owslib>=0.31.0",
    "rasterio>=1.3.0",
    "pyyaml>=6.0.0",
    "aiohttp>=3.14.1",
    "nest-asyncio>=1.6.0",
]
all = [
    "geopandas>=0.14.0",
    "shapely>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "owslib>=0.31.0",
    "rasterio>=1.3.0",
    "pyyaml>=6.0.0",
    "unfccc-di-api>=4.0.4",
    "scikit-learn>=1.7.2",
    "aiohttp>=3.14.1",
    "nest-asyncio>=1.6.0",
    "jupyter>=1.0.0",
    "jupyterlab>=4.0.0",
    "matplotlib>=3.8.0",
    "folium>=0.15.0",
    "mapclassify>=2.6.0",
    "playwright>=1.61.0",
    "jupytext>=1.19.4",
    "torch>=2.0.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/estonia_landuse"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
